<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f6fd;--card:#fff;--text:#1b1630;--muted:#6f6a85;--line:#e7e3f5;--a:#4338ca;--a2:#f97316;--at:#fff;--grad:linear-gradient(135deg,#3730a3,#4f46e5 55%,#f97316);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f1f;--card:#1c1830;--text:#f4f1ff;--muted:#a49fbe;--line:#2f2a4a;--a:#818cf8;--a2:#fb923c;--at:#140d2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120f1f;--card:#1c1830;--text:#f4f1ff;--muted:#a49fbe;--line:#2f2a4a;--a:#818cf8;--a2:#fb923c;--at:#140d2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:21px;text-decoration:none;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:10px;align-items:center}
.ib{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:8px 14px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;position:relative}
.badge{position:absolute;top:-7px;right:-7px;background:var(--a2);color:#fff;border-radius:99px;font-size:11px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;font-weight:700}
main{max-width:1060px;margin:0 auto;padding:20px}
.hero{border-radius:22px;padding:40px 28px;color:#fff;background:var(--grad);text-align:center;margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px)}.hero p{margin:0 0 18px;opacity:.92}
.search{max-width:440px;margin:0 auto;border:0;border-radius:99px;padding:13px 20px;width:100%;font:inherit;background:#fff;color:#1b1630}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:7px 16px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
select,input,textarea{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;width:100%}
select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(67,56,202,.2)}
.img{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:76px;background-size:cover;background-position:center;position:relative}
.off{position:absolute;top:10px;left:10px;background:var(--a2);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.cb{padding:12px 14px}.tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pr{font-weight:800}.mrp{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:14px;margin-left:6px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:12px}
@media(max-width:700px){.detail{grid-template-columns:1fr}}
.detail .img{border-radius:20px;font-size:130px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.sizes button{padding:8px 15px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer;font:inherit}
.sizes button.on{background:var(--grad);color:#fff;border-color:transparent}
.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--grad);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.o{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.w{width:100%}.btn.s{padding:7px 12px;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
#ov{position:fixed;inset:0;z-index:40;display:none;background:rgba(10,6,25,.55)}
#ov.on{display:block}
.dr{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg);padding:20px;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.ci{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .img{width:60px;height:60px;aspect-ratio:auto;font-size:30px;border-radius:12px;flex:none}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.err{color:#dc2626;font-size:14px;min-height:20px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;display:none;font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.g2{grid-template-columns:1fr}}
.arow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.arow>div:nth-child(2){flex:1;min-width:0}
.arow .img{width:52px;height:52px;aspect-ratio:auto;font-size:26px;border-radius:10px;flex:none}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:30px;text-align:center;color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 20px}
a.bk{color:var(--muted);text-decoration:none;font-size:14px}
.an{background:var(--grad);color:#fff;text-align:center;font-size:14px;padding:8px 12px;font-weight:600}
.hrt{position:absolute;top:8px;right:8px;background:var(--card);border-radius:99px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.bd{position:absolute;bottom:10px;left:10px;background:#111;color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.off.so{background:#6b7280}
.sm{display:flex;justify-content:space-between;margin:6px 0}.tt{font-weight:800;font-size:18px;margin-top:12px}
.cpn{display:flex;gap:8px;margin:14px 0}.cpn input{text-transform:uppercase}
.wa{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#22c55e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;z-index:25;box-shadow:0 6px 18px rgba(0,0,0,.25)}
details{border-bottom:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:600}
html:root:not([data-nope]){--bg:#0a1230;--card:#111c44;--text:#f2f5ff;--muted:#9aa8d6;--line:#243166;--a:#fbbf24;--a2:#fbbf24;--at:#0a1230;--grad:linear-gradient(135deg,#fde047,#fbbf24);color-scheme:dark}
.logo{font-weight:900}
header{border-bottom:1px solid var(--line)}
.an{background:#fbbf24;color:#0a1230;font-weight:800}
.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb 60%,#3b82f6);color:#fff;padding:56px 24px;box-shadow:0 14px 34px rgba(37,99,235,.35)}
.hero h1{font-weight:900;letter-spacing:-.02em;font-size:clamp(34px,8vw,58px);color:#fff}
.hero p{color:#dbe7ff;opacity:1}
.search{background:#fff;color:#0a1230;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn{color:#0a1230;font-weight:800;box-shadow:0 6px 16px rgba(251,191,36,.22)}
.btn.s{box-shadow:none}
.btn:not(.s){text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.btn.o{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.chip.on{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:700}
.sizes button.on{background:#fbbf24;color:#0a1230;border-color:#fbbf24;font-weight:700}
.off,.badge{background:#fbbf24;color:#0a1230;font-weight:800}.off.so{background:#6b7280;color:#fff}
.bd{background:#2563eb;color:#fff;border:0}
.pr{color:#fbbf24}.mrp{color:var(--muted)}
.card:hover{border-color:#3b82f6;box-shadow:0 12px 30px rgba(37,99,235,.35)}
input:focus,select:focus,textarea:focus{outline:2px solid #3b82f6;border-color:#3b82f6}
.tt span{color:#fbbf24}
.spec{display:grid;gap:4px;margin:12px 0;font-size:14px}.spec div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0}.spec span{color:var(--muted)}
.img{background-position:center 25%}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}.thumbs:empty{display:none}.thumbs button{width:64px;height:64px;flex:none;border-radius:12px;border:2px solid var(--line);background-size:cover;background-position:center top;cursor:pointer}.thumbs button.on{border-color:var(--a)}
</style>
</head>

<script>
var DB=JSON.parse(document.getElementById("catalog").textContent);
var CATS=["Clothes","Shoes","Electronics","Home & kitchen","Accessories & bags"];
var SZ={Clothes:["S","M","L","XL","XXL"],Shoes:["IND 6","IND 7","IND 8","IND 9","IND 10"]};
var EM={Clothes:"👕",Shoes:"👟",Electronics:"🎧","Home & kitchen":"🏠","Accessories & bags":"👜"};
var BG={Clothes:"#fde68a",Shoes:"#bfdbfe",Electronics:"#ddd6fe","Home & kitchen":"#bbf7d0","Accessories & bags":"#fed7aa"};
var $=function(i){return document.getElementById(i)};
var app=$("app"),ov=$("ov"),fcat="All",fq="",fsort="new",admin=false,size="",editId=null,cur="";
function ld(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cart=ld("cart"),wish=ld("wish");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function inr(n){return "₹"+Number(n).toLocaleString("en-IN")}
function base(){return location.href.split("#")[0]}
function P(id){return DB.products.filter(function(p){return p.id===id})[0]}
function off(p){return p.mrp>p.price?Math.round((1-p.price/p.mrp)*100):0}
function pimg(p,x){return '<div class="img" style="background-color:'+BG[p.cat]+(p.img?';background-image:url('+p.img+')':'')+'">'+(p.img?'':EM[p.cat])+(x||'')+'</div>'}
function saveCart(){sv("cart",cart);head()}
function tw(id){var i=wish.indexOf(id);if(i<0)wish.push(id);else wish.splice(i,1);sv("wish",wish);head()}
function count(){return cart.reduce(function(a,c){return a+c.qty},0)}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2400)}
function cps(){return (DB.settings.coupons||"").split(",").map(function(x){var a=x.split(":");return{c:a[0].trim().toUpperCase(),p:Number(a[1])}}).filter(function(x){return x.c&&x.p>0&&x.p<=90})}
function cpct(){var f=cps().filter(function(x){return x.c===cur})[0];return f?f.p:0}
function copy(u){try{navigator.clipboard.writeText(u).then(function(){toast("Link copied")},function(){prompt("Copy:",u)})}catch(e){prompt("Copy:",u)}}
function head(){

function theme(n){
  var t=TH[n]||TH.calm,el=$("th");if(!el){el=document.createElement("style");el.id="th";document.head.appendChild(el)}
  el.textContent='html:root:not([data-nope]){--bg:'+t.bg+';--card:'+t.card+';--text:'+t.text+';--muted:'+t.muted+';--line:'+t.line+';--a:'+t.a+';--a2:'+t.a+';--at:'+t.ct+';--grad:'+t.cta+';color-scheme:'+t.sch+'}'
  +'.an{background:'+t.an+';color:'+t.ant+'}.hero{background:'+t.hero+';color:'+t.ht+';box-shadow:0 14px 34px rgba(0,0,0,.2)}.hero h1{color:'+t.ht+'}.hero p{color:'+t.ht+';opacity:.85}'
  +'.btn{color:'+t.ct+';box-shadow:0 6px 16px rgba(0,0,0,.18)}.btn.s{box-shadow:none}.btn.o{background:var(--card);color:var(--text);box-shadow:none}'
  +'.chip.on,.sizes button.on,.bd{background:'+t.chip+';color:'+t.chipt+';border-color:'+t.chip+'}.bd{border:0}'
  +'.off,.badge{background:'+t.a+';color:'+t.ct+'}.off.so{background:#6b7280;color:#fff}'
  +'.pr,.tt span{color:'+t.a+'}.card:hover{border-color:'+t.chip+';box-shadow:0 12px 30px rgba(0,0,0,.18)}input:focus,select:focus,textarea:focus{outline:2px solid '+t.chip+';border-color:'+t.chip+'}'+(t.x||"");
}
function route(){
  var h=decodeURIComponent(location.hash.slice(1)),p=DB.products.filter(function(x){return x.slug===h})[0];
  closeOv();openCart.f=false;
  if(h.indexOf("theme-")===0){theme(h.slice(6));toast("Previewing theme: "+h.slice(6));home();scrollTo(0,0);return}
  if(h==="admin"&&admin)adminView();else if(p)product(p);else home();
  scrollTo(0,0);
}
window.addEventListener("hashchange",route);
